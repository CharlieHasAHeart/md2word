[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-app-backend"
version = "0.1.0"
description = "FastAPI backend for the multi-app workspace"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "python-docx",
]

[project.optional-dependencies]
test = [
  "pytest",
  "httpx",
]

[project.scripts]
md2word-web = "backend.main:main"
md2word = "backend.md2word.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*"]
